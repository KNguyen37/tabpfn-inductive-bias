[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabbias"
version = "0.1.0"
description = "Measure and visualize the inductive bias of TabPFN on small tabular problems."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "pyarrow", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
